<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Highway Traffic 3D</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #16a8ff;
      font-family: 'Inter', sans-serif;
      touch-action: none;
      color: #ffffff;
    }
    #game-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 1;
    }
    /* Reference Top HUD Pills */
    .hud-stat-pill {
      background: rgba(11, 22, 34, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 14px;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(6px);
    }
    .hud-top-btn {
      background: rgba(11, 20, 30, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 12px;
      color: #ffffff;
      box-shadow: 0 5px 14px rgba(0, 0, 0, 0.35);
      transition: transform 0.08s ease, background-color 0.12s ease;
    }
    .hud-top-btn:active {
      transform: scale(0.95);
      background: rgba(25, 42, 62, 0.96);
    }
    /* Reference Glossy Metallic Squircle Touch Buttons */
    .ctrl-btn-dark {
      background: linear-gradient(180deg, #323842 0%, #16191f 52%, #0b0d11 100%);
      border: 2.5px solid #cbd5e1;
      border-radius: 18px;
      color: #ffffff;
      box-shadow:
        0 8px 20px rgba(0, 0, 0, 0.55),
        inset 0 2px 3px rgba(255, 255, 255, 0.35),
        inset 0 -3px 6px rgba(0, 0, 0, 0.7);
      transition: transform 0.06s ease, filter 0.06s ease;
    }
    .ctrl-btn-dark.active, .ctrl-btn-dark:active {
      transform: translateY(2px) scale(0.96);
      filter: brightness(1.25);
      border-color: #ffffff;
    }
    .ctrl-btn-light {
      background: linear-gradient(180deg, #ffffff 0%, #f1f5f9 55%, #cbd5e1 100%);
      border: 2.5px solid #94a3b8;
      border-radius: 18px;
      color: #0f172a;
      box-shadow:
        0 8px 20px rgba(0, 0, 0, 0.55),
        inset 0 2px 4px rgba(255, 255, 255, 0.9),
        inset 0 -3px 6px rgba(100, 116, 139, 0.4);
      transition: transform 0.06s ease, filter 0.06s ease;
    }
    .ctrl-btn-light.active, .ctrl-btn-light:active {
      transform: translateY(2px) scale(0.96);
      filter: brightness(0.93);
    }
    /* Strictly Simple Black & White Start/Crash Menu */
    .bw-btn {
      background: #000000;
      border: 1px solid #ffffff;
      color: #ffffff;
      transition: background-color 0.1s ease, color 0.1s ease;
    }
    .bw-btn:hover, .bw-btn:active {
      background: #ffffff;
      color: #000000;
    }
  </style>
</head>
<body class="relative w-full h-full select-none overflow-hidden">

  <!-- 3D Three.js Canvas -->
  <canvas id="game-canvas"></canvas>

  <!-- Reference Colorful Top HUD -->
  <div id="hud-top" class="fixed top-0 left-0 right-0 z-20 p-2.5 sm:p-4 flex items-start justify-between gap-2 pointer-events-none">
    <!-- Top-Left Stat Pills (SCORE, SPEED, BEST) -->
    <div class="flex items-center gap-2 sm:gap-3 pointer-events-auto">
      <div class="hud-stat-pill px-3.5 py-1.5 sm:px-4 sm:py-2 text-center min-w-[72px] sm:min-w-[88px]">
        <div class="text-[10px] sm:text-xs font-black tracking-wider uppercase text-[#ffd60a] leading-tight">SCORE</div>
        <div id="hud-score" class="text-lg sm:text-2xl font-black tracking-tight text-white tabular-nums leading-tight">0</div>
      </div>

      <div class="hud-stat-pill px-3.5 py-1.5 sm:px-4 sm:py-2 text-center min-w-[96px] sm:min-w-[116px]">
        <div class="text-[10px] sm:text-xs font-black tracking-wider uppercase text-[#ffd60a] leading-tight">SPEED</div>
        <div class="flex items-baseline justify-center gap-1 leading-tight">
          <span id="hud-speed" class="text-lg sm:text-2xl font-black tracking-tight text-white tabular-nums">135</span>
          <span class="text-[10px] sm:text-xs font-black text-[#ffd60a]">KM/H</span>
        </div>
      </div>

      <div class="hud-stat-pill px-3.5 py-1.5 sm:px-4 sm:py-2 text-center min-w-[76px] sm:min-w-[92px]">
        <div class="text-[10px] sm:text-xs font-black tracking-wider uppercase text-[#ffd60a] leading-tight">BEST</div>
        <div id="hud-best" class="text-lg sm:text-2xl font-black tracking-tight text-white tabular-nums leading-tight">0</div>
      </div>
    </div>

    <!-- Top-Right Action Pills (CAM, 2-WAY, SOUND) -->
    <div class="flex items-center gap-1.5 sm:gap-2.5 pointer-events-auto">
      <button id="btn-camera" class="hud-top-btn px-2.5 py-2 sm:px-3.5 sm:py-2.5 flex items-center gap-1.5 text-[11px] sm:text-xs font-extrabold uppercase tracking-wider">
        <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24">
          <path d="M9 3L7.17 5H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2h-3.17L15 3H9zm3 15c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.65 0-3 1.35-3 3s1.35 3 3 3 3-1.35 3-3-1.35-3-3-3z"/>
        </svg>
        <span>CAM</span>
      </button>

      <button id="btn-traffic-mode" class="hud-top-btn px-2.5 py-2 sm:px-3.5 sm:py-2.5 flex items-center gap-1.5 text-[11px] sm:text-xs font-extrabold uppercase tracking-wider">
        <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 17.93V18h-2v1.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 12v1c0 1.1.9 2 2 2h2c1.1 0 2-.9 2-2v-1l4.79-1.79c.13.58.21 1.17.21 1.79 0 4.08-3.05 7.44-7 7.93zM12 7c1.66 0 3 1.34 3 3H9c0-1.66 1.34-3 3-3z"/>
        </svg>
        <span id="txt-traffic-mode">2-WAY</span>
      </button>

      <button id="btn-audio" class="hud-top-btn px-2.5 py-2 sm:px-3.5 sm:py-2.5 flex items-center gap-1.5 text-[11px] sm:text-xs font-extrabold uppercase tracking-wider">
        <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24">
          <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
        </svg>
        <span id="txt-audio">MUSIC: ON</span>
      </button>
    </div>
  </div>

  <!-- Reference Glossy Squircle Touch Controls -->
  <div id="touch-controls" class="fixed bottom-3 sm:bottom-5 left-0 right-0 px-3 sm:px-6 z-20 flex items-end justify-between pointer-events-none">
    <!-- Left / Right Steering -->
    <div class="flex items-center gap-2.5 sm:gap-3.5 pointer-events-auto">
      <button id="btn-left" aria-label="Steer Left" class="ctrl-btn-dark w-[74px] h-[78px] sm:w-24 sm:h-24 flex flex-col items-center justify-center gap-1.5">
        <svg class="w-7 h-7 sm:w-9 sm:h-9 fill-white" viewBox="0 0 24 24">
          <path d="M16 5v14L6 12z"/>
        </svg>
        <span class="text-[11px] sm:text-xs font-black tracking-wider uppercase">LEFT</span>
      </button>

      <button id="btn-right" aria-label="Steer Right" class="ctrl-btn-dark w-[74px] h-[78px] sm:w-24 sm:h-24 flex flex-col items-center justify-center gap-1.5">
        <svg class="w-7 h-7 sm:w-9 sm:h-9 fill-white" viewBox="0 0 24 24">
          <path d="M8 5v14l10-7z"/>
        </svg>
        <span class="text-[11px] sm:text-xs font-black tracking-wider uppercase">RIGHT</span>
      </button>
    </div>

    <!-- Beam / Brake / Gas -->
    <div class="flex items-end gap-2 sm:gap-3 pointer-events-auto">
      <button id="btn-flash" aria-label="High Beams" class="ctrl-btn-dark w-[68px] h-[78px] sm:w-20 sm:h-24 flex flex-col items-center justify-center gap-1.5">
        <svg class="w-7 h-7 sm:w-8 sm:h-8 stroke-white fill-none" stroke-width="2" viewBox="0 0 24 24">
          <path d="M11 6c4.5 0 8 2.5 8 6s-3.5 6-8 6V6z" fill="white" fill-opacity="0.25"/>
          <path stroke-linecap="round" d="M3 8h5M2 12h6M3 16h5"/>
        </svg>
        <span class="text-[11px] sm:text-xs font-black tracking-wider uppercase">BEAM</span>
      </button>

      <button id="btn-brake" aria-label="Brake" class="ctrl-btn-dark w-[68px] h-[78px] sm:w-20 sm:h-24 flex flex-col items-center justify-center gap-1.5">
        <svg class="w-7 h-7 sm:w-8 sm:h-8 fill-white" viewBox="0 0 24 24">
          <path d="M12 2a10 10 0 1010 10A10 10 0 0012 2zm0 16a6 6 0 116-6 6 6 0 01-6 6zm0-9a3 3 0 103 3 3 3 0 00-3-3z"/>
          <circle cx="12" cy="4.5" r="1.1" fill="#111"/>
          <circle cx="12" cy="19.5" r="1.1" fill="#111"/>
          <circle cx="4.5" cy="12" r="1.1" fill="#111"/>
          <circle cx="19.5" cy="12" r="1.1" fill="#111"/>
        </svg>
        <span class="text-[11px] sm:text-xs font-black tracking-wider uppercase">BRAKE</span>
      </button>

      <button id="btn-gas" aria-label="Accelerate" class="ctrl-btn-light w-[68px] h-[78px] sm:w-20 sm:h-24 flex flex-col items-center justify-center gap-1.5">
        <svg class="w-7 h-7 sm:w-8 sm:h-8 fill-slate-900" viewBox="0 0 24 24">
          <path d="M19.77 7.23l.01-.01-3.72-3.72L15 4.56l2.11 2.11c-.94.36-1.61 1.26-1.61 2.33a2.5 2.5 0 002.5 2.5c.36 0 .69-.08 1-.21v7.21c0 .55-.45 1-1 1s-1-.45-1-1V14c0-1.1-.9-2-2-2h-1V5c0-1.1-.9-2-2-2H6c-1.1 0-2 .9-2 2v16h10v-7.5h1.5v5a2.5 2.5 0 005 0V9c0-.69-.28-1.32-.73-1.77zM12 10H6V5h6v5z"/>
        </svg>
        <span class="text-[11px] sm:text-xs font-black tracking-wider uppercase text-slate-900">GAS</span>
      </button>
    </div>
  </div>

  <!-- Strictly Minimal Black & White Menu Overlay -->
  <div id="modal-overlay" class="fixed inset-0 z-30 flex items-center justify-center bg-black/85 p-4">
    <div class="w-full max-w-sm bg-black border border-white p-8 text-center flex flex-col items-center">
      <h1 id="modal-title" class="text-2xl font-extrabold tracking-widest uppercase text-white">
        HIGHWAY TRAFFIC
      </h1>

      <div class="w-full border-t border-b border-white/40 my-6 py-4 flex justify-around">
        <div>
          <div class="text-[10px] tracking-widest uppercase text-neutral-400">SCORE</div>
          <div id="final-score" class="text-2xl font-extrabold text-white mt-0.5 tabular-nums">0</div>
        </div>
        <div class="w-[1px] bg-white/40"></div>
        <div>
          <div class="text-[10px] tracking-widest uppercase text-neutral-400">BEST</div>
          <div id="final-best" class="text-2xl font-extrabold text-white mt-0.5 tabular-nums">0</div>
        </div>
      </div>

      <p class="text-xs text-neutral-400 tracking-wide uppercase mb-6">
        WASD / ARROWS TO DRIVE &bull; SPACE FOR HIGH BEAM
      </p>

      <button id="btn-start" class="bw-btn w-full py-3.5 px-6 font-extrabold text-sm tracking-widest uppercase cursor-pointer">
        START
      </button>
    </div>
  </div>

  <script>
    // ============================================================================
    // 1. SYNTHWAVE / ARCADE DRIVING MUSIC ENGINE (NO ENGINE/HORN/CRASH SOUNDS)
    // ============================================================================
    class MusicEngine {
      constructor() {
        this.ctx = null;
        this.muted = false;
        this.playing = false;
        this.timerId = null;
        this.masterGain = null;
        this.step = 0;
        this.nextNoteTime = 0;
        this.bpm = 128;

        // 16-step driving bassline progression (Am - F - C - G)
        this.bassProgression = [
          // Bar 1: A minor
          110.0, 110.0, 220.0, 110.0, 110.0, 110.0, 196.0, 220.0,
          // Bar 2: F major
          87.31, 87.31, 174.61, 87.31, 87.31, 87.31, 164.81, 174.61,
          // Bar 3: C major
          130.81, 130.81, 261.63, 130.81, 130.81, 130.81, 220.0, 261.63,
          // Bar 4: G major
          98.0, 98.0, 196.0, 98.0, 98.0, 110.0, 130.81, 146.83
        ];

        // 32-step upbeat arcade lead synth melody (0 = rest)
        this.leadMelody = [
          // Bar 1 (Am)
          440.0, 0, 523.25, 0, 659.25, 587.33, 523.25, 440.0,
          // Bar 2 (F)
          349.23, 0, 440.0, 0, 587.33, 523.25, 440.0, 392.0,
          // Bar 3 (C)
          523.25, 0, 659.25, 0, 783.99, 659.25, 587.33, 523.25,
          // Bar 4 (G)
          587.33, 659.25, 587.33, 493.88, 392.0, 493.88, 587.33, 0
        ];

        // Background pad chords per 8-step bar
        this.padChords = [
          [220.0, 261.63, 329.63], // Am
          [174.61, 220.0, 261.63], // F
          [261.63, 329.63, 392.0], // C
          [196.0, 246.94, 293.66]  // G
        ];
      }

      ensureContext() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) {
            this.ctx = new AudioCtx();
          }
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      startMusic() {
        this.stopMusic();
        if (this.muted) return;
        this.ensureContext();
        if (!this.ctx) return;

        this.masterGain = this.ctx.createGain();
        this.masterGain.gain.setValueAtTime(0.28, this.ctx.currentTime);
        this.masterGain.connect(this.ctx.destination);

        this.playing = true;
        this.step = 0;
        this.nextNoteTime = this.ctx.currentTime + 0.04;

        this.timerId = setInterval(() => this.scheduler(), 25);
      }

      stopMusic() {
        this.playing = false;
        if (this.timerId) {
          clearInterval(this.timerId);
          this.timerId = null;
        }
        if (this.masterGain && this.ctx) {
          try {
            this.masterGain.gain.cancelScheduledValues(this.ctx.currentTime);
            this.masterGain.gain.setValueAtTime(0, this.ctx.currentTime);
            this.masterGain.disconnect();
          } catch (e) {}
          this.masterGain = null;
        }
      }

      scheduler() {
        if (!this.playing || this.muted || !this.ctx || !this.masterGain) return;
        const stepDuration = (60 / this.bpm) / 2; // 8th-note grid
        while (this.nextNoteTime < this.ctx.currentTime + 0.12) {
          this.scheduleStep(this.step, this.nextNoteTime, stepDuration);
          this.nextNoteTime += stepDuration;
          this.step = (this.step + 1) % 32;
        }
      }

      scheduleStep(step, time, dur) {
        if (!this.masterGain) return;

        // 1. Four-on-the-floor punchy kick drum on even steps
        if (step % 2 === 0) {
          this.playKick(time);
        }

        // 2. Crisp synthwave snare on backbeats (steps 2, 6, 10, 14...)
        if (step % 4 === 2) {
          this.playSnare(time);
        }

        // 3. Off-beat hi-hat groove
        this.playHiHat(time, step % 2 === 1 ? 0.07 : 0.03);

        // 4. Driving sawtooth synth bassline
        const bassFreq = this.bassProgression[step % this.bassProgression.length];
        if (bassFreq) {
          this.playBassNote(bassFreq, time, dur * 0.85);
        }

        // 5. Warm chord pad on the start of each 8-step bar
        if (step % 8 === 0) {
          const chord = this.padChords[Math.floor(step / 8) % this.padChords.length];
          this.playPadChord(chord, time, dur * 7.8);
        }

        // 6. Bright arcade lead melody
        const leadFreq = this.leadMelody[step % this.leadMelody.length];
        if (leadFreq > 0) {
          this.playLeadNote(leadFreq, time, dur * 0.9);
        }
      }

      playKick(time) {
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(135, time);
          osc.frequency.exponentialRampToValueAtTime(36, time + 0.12);

          gain.gain.setValueAtTime(0.45, time);
          gain.gain.exponentialRampToValueAtTime(0.001, time + 0.14);

          osc.connect(gain);
          gain.connect(this.masterGain);
          osc.start(time);
          osc.stop(time + 0.15);
        } catch (e) {}
      }

      playSnare(time) {
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(210, time);
          osc.frequency.exponentialRampToValueAtTime(95, time + 0.11);

          gain.gain.setValueAtTime(0.18, time);
          gain.gain.exponentialRampToValueAtTime(0.001, time + 0.12);

          osc.connect(gain);
          gain.connect(this.masterGain);
          osc.start(time);
          osc.stop(time + 0.13);
        } catch (e) {}
      }

      playHiHat(time, amp) {
        try {
          const osc = this.ctx.createOscillator();
          const filter = this.ctx.createBiquadFilter();
          const gain = this.ctx.createGain();

          osc.type = 'square';
          osc.frequency.setValueAtTime(6800, time);
          filter.type = 'highpass';
          filter.frequency.setValueAtTime(5200, time);

          gain.gain.setValueAtTime(amp, time);
          gain.gain.exponentialRampToValueAtTime(0.0005, time + 0.045);

          osc.connect(filter);
          filter.connect(gain);
          gain.connect(this.masterGain);
          osc.start(time);
          osc.stop(time + 0.05);
        } catch (e) {}
      }

      playBassNote(freq, time, dur) {
        try {
          const osc = this.ctx.createOscillator();
          const filter = this.ctx.createBiquadFilter();
          const gain = this.ctx.createGain();

          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(freq, time);

          filter.type = 'lowpass';
          filter.frequency.setValueAtTime(640, time);
          filter.frequency.exponentialRampToValueAtTime(210, time + dur);

          gain.gain.setValueAtTime(0.22, time);
          gain.gain.exponentialRampToValueAtTime(0.001, time + dur);

          osc.connect(filter);
          filter.connect(gain);
          gain.connect(this.masterGain);
          osc.start(time);
          osc.stop(time + dur + 0.01);
        } catch (e) {}
      }

      playLeadNote(freq, time, dur) {
        try {
          const osc = this.ctx.createOscillator();
          const filter = this.ctx.createBiquadFilter();
          const gain = this.ctx.createGain();

          osc.type = 'square';
          osc.frequency.setValueAtTime(freq, time);

          filter.type = 'lowpass';
          filter.frequency.setValueAtTime(2200, time);

          gain.gain.setValueAtTime(0.11, time);
          gain.gain.exponentialRampToValueAtTime(0.001, time + dur);

          osc.connect(filter);
          filter.connect(gain);
          gain.connect(this.masterGain);
          osc.start(time);
          osc.stop(time + dur + 0.01);
        } catch (e) {}
      }

      playPadChord(freqs, time, dur) {
        try {
          freqs.forEach((f) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(f, time);

            gain.gain.setValueAtTime(0.001, time);
            gain.gain.linearRampToValueAtTime(0.045, time + 0.08);
            gain.gain.exponentialRampToValueAtTime(0.001, time + dur);

            osc.connect(gain);
            gain.connect(this.masterGain);
            osc.start(time);
            osc.stop(time + dur + 0.02);
          });
        } catch (e) {}
      }
    }

    const music = new MusicEngine();

    // ============================================================================
    // 2. VIBRANT STYLIZED PROCEDURAL TEXTURES (SKY, CLOUDS, SIGNS, BMW BADGE, CITY)
    // ============================================================================
    function createSkyGradientTexture() {
      const c = document.createElement('canvas');
      c.width = 32;
      c.height = 512;
      const ctx = c.getContext('2d');
      const grad = ctx.createLinearGradient(0, 0, 0, 512);
      grad.addColorStop(0.0, '#0088ff');
      grad.addColorStop(0.32, '#19b5ff');
      grad.addColorStop(0.68, '#7ce4ff');
      grad.addColorStop(0.92, '#c8f7ff');
      grad.addColorStop(1.0, '#e3fbff');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 32, 512);
      return new THREE.CanvasTexture(c);
    }

    function createCartoonCloudTexture() {
      const c = document.createElement('canvas');
      c.width = 512;
      c.height = 256;
      const ctx = c.getContext('2d');

      // Soft blue bottom shadow puff
      ctx.fillStyle = '#c4ecff';
      const puffs = [
        [130, 165, 58],
        [210, 145, 76],
        [300, 152, 68],
        [380, 172, 52],
        [170, 178, 55],
        [330, 178, 55]
      ];
      ctx.beginPath();
      puffs.forEach(([x, y, r]) => {
        ctx.moveTo(x + r, y);
        ctx.arc(x, y + 8, r, 0, Math.PI * 2);
      });
      ctx.fill();

      // Crisp bright white upper cloud puffs
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      puffs.forEach(([x, y, r]) => {
        ctx.moveTo(x + r, y);
        ctx.arc(x, y, r, 0, Math.PI * 2);
      });
      ctx.fillRect(120, 155, 265, 58);
      ctx.fill();

      // Subtle flat cartoon base trim
      ctx.clearRect(0, 212, 512, 44);

      const tex = new THREE.CanvasTexture(c);
      return tex;
    }

    function createHighwayTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 1024;
      canvas.height = 1024;
      const ctx = canvas.getContext('2d');

      // Smooth stylized warm-gray asphalt matching reference image
      ctx.fillStyle = '#686568';
      ctx.fillRect(0, 0, 1024, 1024);

      // Subtle longitudinal speed streaks baked into the road surface
      for (let i = 0; i < 420; i++) {
        const x = Math.random() * 1024;
        const w = 2 + Math.random() * 6;
        const alpha = 0.03 + Math.random() * 0.05;
        ctx.fillStyle = i % 2 === 0 ? `rgba(255,255,255,${alpha})` : `rgba(30,28,32,${alpha})`;
        ctx.fillRect(x, 0, w, 1024);
      }

      // Slightly darker smooth tire tracks per lane
      const laneCenters = [142, 384, 640, 882];
      laneCenters.forEach((cx) => {
        ctx.fillStyle = 'rgba(42, 40, 45, 0.18)';
        ctx.fillRect(cx - 56, 0, 112, 1024);
      });

      // Crisp bright white outer edge lines
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(18, 0, 14, 1024);
      ctx.fillRect(992, 0, 14, 1024);

      // Crisp solid white center line
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(505, 0, 14, 1024);

      // Dashed white lane dividers
      const dashLen = 215;
      const gapLen = 297;
      for (let y = 35; y < 1024; y += (dashLen + gapLen)) {
        ctx.fillRect(258, y, 12, dashLen);
        ctx.fillRect(754, y, 12, dashLen);
      }

      const tex = new THREE.CanvasTexture(canvas);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.anisotropy = 8;
      tex.repeat.set(1, 14);
      return tex;
    }

    function createGreenHighwaySignTexture() {

    function createBMWRoundelTexture() {
      const c = document.createElement('canvas');
      c.width = 256;
      c.height = 256;
      const ctx = c.getContext('2d');

      // Outer silver ring
      ctx.beginPath();
      ctx.arc(128, 128, 122, 0, Math.PI * 2);
      ctx.fillStyle = '#e2e8f0';
      ctx.fill();

      // Black bezel ring
      ctx.beginPath();
      ctx.arc(128, 128, 112, 0, Math.PI * 2);
      ctx.fillStyle = '#090d14';
      ctx.fill();

      // Inner silver divider circle
      ctx.beginPath();
      ctx.arc(128, 128, 82, 0, Math.PI * 2);
      ctx.fillStyle = '#cbd5e1';
      ctx.fill();

      // 4 Blue & White Quadrants
      const r = 78;
      // Top-left: Blue
      ctx.beginPath();
      ctx.moveTo(128, 128);
      ctx.arc(128, 128, r, Math.PI, Math.PI * 1.5);
      ctx.closePath();
      ctx.fillStyle = '#0066b1';
      ctx.fill();

      // Top-right: White
      ctx.beginPath();
      ctx.moveTo(128, 128);
      ctx.arc(128, 128, r, Math.PI * 1.5, Math.PI * 2);
      ctx.closePath();
      ctx.fillStyle = '#ffffff';
      ctx.fill();

      // Bottom-right: Blue
      ctx.beginPath();
      ctx.moveTo(128, 128);
      ctx.arc(128, 128, r, 0, Math.PI * 0.5);
      ctx.closePath();
      ctx.fillStyle = '#0066b1';
      ctx.fill();

      // Bottom-left: White
      ctx.beginPath();
      ctx.moveTo(128, 128);
      ctx.arc(128, 128, r, Math.PI * 0.5, Math.PI);
      ctx.closePath();
      ctx.fillStyle = '#ffffff';
      ctx.fill();

      // Crisp crosshairs
      ctx.strokeStyle = '#0f172a';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(128, 50);
      ctx.lineTo(128, 206);
      ctx.moveTo(50, 128);
      ctx.lineTo(206, 128);
      ctx.stroke();

      return new THREE.CanvasTexture(c);
    }

    function createSkyscraperTexture(baseHex, windowHex) {
      const c = document.createElement('canvas');

      c.height = 512;
      const ctx = c.getContext('2d');

      ctx.fillStyle = baseHex;
      ctx.fillRect(0, 0, 256, 512);

      grad.addColorStop(0, 'rgba(255,255,255,0.22)');

      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 256, 512);

      // Stylized bright cyan/white window grid
      ctx.fillStyle = windowHex;
      for (let y = 18; y < 490; y += 22) {
        for (let x = 18; x < 230; x += 28) {
          if ((x + y) % 5 !== 0) {
            ctx.fillRect(x, y, 18, 12);

        }
      }
      return new THREE.CanvasTexture(c);

    // ============================================================================
    // 4. SCULPTED 3D AUTOMOTIVE GEOMETRY ENGINE (NO BOXY CARS!)
    // ============================================================================
    function createSculptedProfileMesh(points2D, width, material, bevelSize = 0.14, bevelThickness = 0.16) {
      const shape = new THREE.Shape();
      shape.moveTo(points2D[0][0], points2D[0][1]);
      for (let i = 1; i < points2D.length; i++) {
        const pt = points2D[i];
        if (pt.length === 4) {
          shape.quadraticCurveTo(pt[0], pt[1], pt[2], pt[3]);
        } else {
          shape.lineTo(pt[0], pt[1]);
        }
      }
      shape.closePath();

      const extrudeDepth = Math.max(0.2, width - bevelThickness * 2);
      const geo = new THREE.ExtrudeGeometry(shape, {
        depth: extrudeDepth,
        bevelEnabled: true,
        bevelSegments: 6,
        steps: 1,
        bevelSize: bevelSize,
        bevelThickness: bevelThickness,
        curveSegments: 20
      });

      geo.center();
      geo.rotateY(Math.PI / 2);
      geo.computeVertexNormals();

      const mesh = new THREE.Mesh(geo, material);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      return mesh;
    }

    function addDetailedWheels(group, xTrack, yRadius, zFront, zRear, tireWidth = 0.32) {
      const tireGeo = new THREE.CylinderGeometry(yRadius, yRadius, tireWidth, 24);
      tireGeo.rotateZ(Math.PI / 2);
      const tireMat = new THREE.MeshStandardMaterial({ color: 0x111318, roughness: 0.82 });

      const rimOuterGeo = new THREE.CylinderGeometry(yRadius * 0.68, yRadius * 0.68, tireWidth + 0.02, 20);
      rimOuterGeo.rotateZ(Math.PI / 2);

      const hubGeo = new THREE.CylinderGeometry(yRadius * 0.22, yRadius * 0.22, tireWidth + 0.05, 12);
      hubGeo.rotateZ(Math.PI / 2);

      const archGeo = new THREE.CylinderGeometry(yRadius * 1.15, yRadius * 1.15, tireWidth + 0.16, 18, 1, false, 0, Math.PI);
      archGeo.rotateZ(Math.PI / 2);

      const coords = [
        [-xTrack, yRadius, zFront],
        [xTrack, yRadius, zFront],
        [-xTrack, yRadius, zRear],
        [xTrack, yRadius, zRear]
      ];

      coords.forEach(([x, y, z]) => {
        const wheelGroup = new THREE.Group();
        wheelGroup.position.set(x, y, z);

        const tire = new THREE.Mesh(tireGeo, tireMat);
        tire.castShadow = true;
        wheelGroup.add(tire);

        const rim = new THREE.Mesh(rimOuterGeo, trimDarkMat);
        wheelGroup.add(rim);

        const hub = new THREE.Mesh(hubGeo, chromeMat);
        wheelGroup.add(hub);

        const spokeSide = x > 0 ? 1 : -1;
        for (let s = 0; s < 5; s++) {
          const angle = (s * Math.PI * 2) / 5;
          const spoke = new THREE.Mesh(
            new THREE.BoxGeometry(0.04, yRadius * 0.62, 0.07),
            chromeMat
          );
          spoke.position.x = spokeSide * (tireWidth * 0.48);
          spoke.position.y = Math.cos(angle) * (yRadius * 0.3);
          spoke.position.z = Math.sin(angle) * (yRadius * 0.3);
          spoke.rotation.x = -angle;
          wheelGroup.add(spoke);
        }

        const arch = new THREE.Mesh(archGeo, trimDarkMat);
        arch.position.set(x * 0.92, y + 0.04, z);
        group.add(arch);

        group.add(wheelGroup);
      });
    }

    function addContactShadow(group, w, l) {
      const geo = new THREE.PlaneGeometry(w, l);
      const mat = new THREE.MeshBasicMaterial({
        color: 0x05070a,
        transparent: true,
        opacity: 0.62,
        depthWrite: false
      });
      const m = new THREE.Mesh(geo, mat);
      m.rotation.x = -Math.PI / 2;
      m.position.y = 0.02;
      group.add(m);
    }

    // ============================================================================
    // 5. PLAYER & DIVERSE TRAFFIC SPAWNER
    // ============================================================================
    const playerCar = createPlayerSportsCar();
    scene.add(playerCar);

    const state = {
      running: false,
      twoWayTraffic: true,
      cameraMode: 0,
      score: 0,
      bestScore: parseInt(localStorage.getItem('highway_3d_best') || '0', 10),
      highBeamTimer: 0,
      elapsedRunTime: 0,

      // Player physics
      x: 1.65,
      vx: 0,
      speedKmh: 145,
      baseCruiseKmh: 138,
      maxSpeedKmh: 265
    };

    document.getElementById('hud-best').textContent = state.bestScore.toLocaleString();
    document.getElementById('final-best').textContent = state.bestScore.toLocaleString();

    const input = {
      left: false,
      right: false,
      gas: false,
      brake: false
    };

    const trafficList = [];
    const trafficContainer = new THREE.Group();
    scene.add(trafficContainer);

    function clearTraffic() {
      while (trafficContainer.children.length > 0) {
        trafficContainer.remove(trafficContainer.children[0]);
      }
      trafficList.length = 0;
    }

    // Colorful stylized traffic palette matching reference image
    const CAR_PALETTE = [
      0x6b88ab, // Slate Blue Metallic (Reference Sports Sedan!)
      0x0ea5e9, // Bright Sky Blue
      0x2563eb, // Electric Royal Blue
      0xef4444, // Vibrant Racing Red
      0xf59e0b, // Amber Gold
      0x10b981, // Emerald Green
      0xffffff, // Pearl White
      0x475569  // Gunmetal Slate
    ];

    function pickColor() {
      return CAR_PALETTE[Math.floor(Math.random() * CAR_PALETTE.length)];
    }

    function createTrafficVehicle(type, laneIndex, zPos, customSpeedKmh = null) {
      let mesh;
      let defaultSpeed = 95;

      switch (type) {
        case 'ambulance':
          mesh = createAmbulanceMesh();
          defaultSpeed = 94;
          break;
        case 'truck':
          mesh = createBoxTruckMesh();
          defaultSpeed = 80;
          break;
        case 'coupe':
          mesh = createSportsCoupeMesh(pickColor());
          defaultSpeed = 108;
          break;
        case 'suv':
          mesh = createModernSUVMesh(pickColor());
          defaultSpeed = 94;
          break;
        case 'pickup':
          mesh = createPickupTruckMesh(pickColor());
          defaultSpeed = 90;
          break;
        case 'coach':
          mesh = createTouringCoachMesh();
          defaultSpeed = 82;
          break;
        case 'sedan':
        default:
          mesh = createLuxurySedanMesh(0x6b88ab);
          defaultSpeed = 98;
          break;
      }

      const isOncoming = state.twoWayTraffic && laneIndex < 2;
      const xPos = LANE_X[laneIndex];
      mesh.position.set(xPos, 0, zPos);

      if (isOncoming) {
        mesh.rotation.y = Math.PI;
      }

      const vehicle = {
        mesh,
        type,
        lane: laneIndex,
        targetX: xPos,
        z: zPos,
        speedKmh: customSpeedKmh !== null ? customSpeedKmh : defaultSpeed,
        isOncoming,
        halfW: mesh.userData.halfW,
        halfL: mesh.userData.halfL,
        intimidated: false
      };

      trafficContainer.add(mesh);
      trafficList.push(vehicle);
      return vehicle;
    }

    function isLaneSafeToSpawn(laneIndex, zPos) {
      let occupiedNearbyLanes = new Set();
      for (const v of trafficList) {
        if (v.lane === laneIndex && Math.abs(v.z - zPos) < 34) {
          return false;
        }
        if (Math.abs(v.z - zPos) < 26) {
          occupiedNearbyLanes.add(v.lane);
        }
      }
      occupiedNearbyLanes.add(laneIndex);
      if (occupiedNearbyLanes.size >= 4) return false;
      return true;
    }

    // Keep highway completely empty at start so the player gets a full 3-second clear gap
    function spawnInitialFormation() {
      clearTraffic();
    }

    playerCar.position.set(state.x, 0, 0);
    spawnInitialFormation();

    // ============================================================================
    // 6. HIGH-BEAM FLASH & INPUT LISTENERS (LAPTOP & PHONE)
    // ============================================================================
    function triggerHighBeam() {
      if (!state.running) return;
      state.highBeamTimer = 0.35;

      for (const v of trafficList) {
        const dz = playerCar.position.z - v.z;
        const dx = Math.abs(playerCar.position.x - v.mesh.position.x);
        if (!v.isOncoming && dz > 3 && dz < 42 && dx < 3.4 && !v.intimidated) {
          v.intimidated = true;
          const nudgeDir = v.lane >= 3 ? 0.55 : v.lane === 2 ? -0.55 : -0.45;
          v.targetX = LANE_X[v.lane] + nudgeDir;
          v.speedKmh += 8;
          state.score += 100;
          break;
        }
      }
    }

    window.addEventListener('keydown', (e) => {
      if (e.repeat && (e.code === 'Space' || e.code === 'KeyC')) return;
      switch (e.code) {
        case 'ArrowLeft':
        case 'KeyA':
          input.left = true;
          document.getElementById('btn-left').classList.add('active');
          break;
        case 'ArrowRight':
        case 'KeyD':
          input.right = true;
          document.getElementById('btn-right').classList.add('active');
          break;
        case 'ArrowUp':
        case 'KeyW':
        case 'ShiftLeft':
        case 'ShiftRight':
          input.gas = true;
          document.getElementById('btn-gas').classList.add('active');
          break;
        case 'ArrowDown':
        case 'KeyS':
          input.brake = true;
          document.getElementById('btn-brake').classList.add('active');
          break;
        case 'Space':
          e.preventDefault();
          triggerHighBeam();
          break;
        case 'KeyC':
          cycleCamera();
          break;
      }
    });

    window.addEventListener('keyup', (e) => {
      switch (e.code) {
        case 'ArrowLeft':
        case 'KeyA':
          input.left = false;
          document.getElementById('btn-left').classList.remove('active');
          break;
        case 'ArrowRight':
        case 'KeyD':
          input.right = false;
          document.getElementById('btn-right').classList.remove('active');
          break;
        case 'ArrowUp':
        case 'KeyW':
        case 'ShiftLeft':
        case 'ShiftRight':
          input.gas = false;
          document.getElementById('btn-gas').classList.remove('active');
          break;
        case 'ArrowDown':
        case 'KeyS':
          input.brake = false;
          document.getElementById('btn-brake').classList.remove('active');
          break;
      }
    });

    function bindHoldButton(btnId, inputKey) {
      const btn = document.getElementById(btnId);
      const activate = (e) => {
        e.preventDefault();
        input[inputKey] = true;
        btn.classList.add('active');
      };
      const deactivate = (e) => {
        e.preventDefault();
        input[inputKey] = false;
        btn.classList.remove('active');
      };
      btn.addEventListener('touchstart', activate, { passive: false });
      btn.addEventListener('touchend', deactivate, { passive: false });
      btn.addEventListener('touchcancel', deactivate, { passive: false });
      btn.addEventListener('mousedown', activate);
      btn.addEventListener('mouseup', deactivate);
      btn.addEventListener('mouseleave', deactivate);
    }

    bindHoldButton('btn-left', 'left');
    bindHoldButton('btn-right', 'right');
    bindHoldButton('btn-gas', 'gas');
    bindHoldButton('btn-brake', 'brake');

    document.getElementById('btn-flash').addEventListener('pointerdown', (e) => {
      e.preventDefault();
      triggerHighBeam();
    });

    function cycleCamera() {
      // No top-down camera! Cycles between Reference Chase Cam (0) and Hood POV Cam (1)
      state.cameraMode = (state.cameraMode + 1) % 2;
    }

    document.getElementById('btn-camera').addEventListener('click', cycleCamera);

    document.getElementById('btn-traffic-mode').addEventListener('click', () => {
      state.twoWayTraffic = !state.twoWayTraffic;
      document.getElementById('txt-traffic-mode').textContent = state.twoWayTraffic ? '2-WAY' : '1-WAY';
      for (const v of trafficList) {
        v.isOncoming = state.twoWayTraffic && v.lane < 2;
        v.mesh.rotation.y = v.isOncoming ? Math.PI : 0;
      }
    });

    document.getElementById('btn-audio').addEventListener('click', () => {
      music.muted = !music.muted;
      document.getElementById('txt-audio').textContent = music.muted ? 'MUSIC: OFF' : 'MUSIC: ON';
      if (music.muted) {
        music.stopMusic();
      } else if (state.running) {
        music.startMusic();
      }
    });

    // ============================================================================
    // 7. CLEAN START & IMMEDIATE POST-CRASH BLACK & WHITE MENU
    // ============================================================================
    const modalOverlay = document.getElementById('modal-overlay');
    const btnStart = document.getElementById('btn-start');

    function startGame() {
      state.running = true;
      state.score = 0;
      state.elapsedRunTime = 0;
      state.x = 1.65;
      state.vx = 0;
      state.speedKmh = 145;

      playerCar.position.set(state.x, 0, 0);
      playerCar.rotation.set(0, 0, 0);

      spawnInitialFormation();
      modalOverlay.classList.add('hidden');
      music.startMusic();
    }

    function triggerCrash() {
      state.running = false;

      // Immediately stop background music so the menu is 100% silent
      music.stopMusic();

      const finalScoreInt = Math.floor(state.score);
      if (finalScoreInt > state.bestScore) {
        state.bestScore = finalScoreInt;
        localStorage.setItem('highway_3d_best', String(state.bestScore));
        document.getElementById('hud-best').textContent = state.bestScore.toLocaleString();
      }

      document.getElementById('modal-title').textContent = 'GAME OVER';
      document.getElementById('final-score').textContent = finalScoreInt.toLocaleString();
      document.getElementById('final-best').textContent = state.bestScore.toLocaleString();
      btnStart.textContent = 'PLAY AGAIN';
      modalOverlay.classList.remove('hidden');
    }

    btnStart.addEventListener('click', startGame);

    // ============================================================================
    // 8. MAIN GAME LOOP & FULL-CAR-VISIBLE CHASE CAMERA (NO TOP CAM)
    // ============================================================================
    let lastTime = performance.now();

    function updateCamera(dt) {
      const isPortrait = window.innerWidth < window.innerHeight;
      let targetCamX, targetCamY, targetCamZ, lookX, lookY, lookZ;

      if (state.cameraMode === 0) {
        // Default Chase Camera: Pulled slightly back so the ENTIRE white & black BMW
        // supercar (rear tires, bumper, quad exhausts, shadow, and road behind it)
        // sits slightly forward in full view cleanly above the bottom control buttons.
        targetCamX = playerCar.position.x * 0.68;
        targetCamY = isPortrait ? 5.25 : 4.65;
        targetCamZ = isPortrait ? 11.8 : 9.8;
        lookX = playerCar.position.x * 0.45;
        lookY = isPortrait ? 0.95 : 1.05;
        lookZ = isPortrait ? -6.5 : -7.5;
      } else {
        // Secondary Closer/Lower Chase Camera: Still shows 100% of the car and rear bumper!
        targetCamX = playerCar.position.x * 0.78;
        targetCamY = isPortrait ? 4.25 : 3.75;
        targetCamZ = isPortrait ? 9.6 : 8.2;
        lookX = playerCar.position.x * 0.52;
        lookY = isPortrait ? 0.95 : 1.0;
        lookZ = isPortrait ? -8.0 : -9.0;
      }

      if (dt <= 0) {
        camera.position.set(targetCamX, targetCamY, targetCamZ);
      } else {
        camera.position.lerp(new THREE.Vector3(targetCamX, targetCamY, targetCamZ), Math.min(1, dt * 12));
      }
      camera.lookAt(lookX, lookY, lookZ);
    }

    function animate(now) {
      requestAnimationFrame(animate);
      const dt = Math.min((now - lastTime) / 1000, 0.05);
      lastTime = now;
      const timeSec = now * 0.001;

      // Visual roof beacons on ambulances
      const flashCycle = Math.floor(timeSec * 8) % 2 === 0;
      for (const v of trafficList) {
        if (v.type === 'ambulance') {
          v.mesh.userData.sirenRedMat.color.setHex(flashCycle ? 0xff1111 : 0x450a0a);
          v.mesh.userData.sirenBlueMat.color.setHex(!flashCycle ? 0x2563eb : 0x172554);
        }
      }

      // Gentle drift of fluffy sky clouds
      for (const c of skyClouds) {
        c.position.x += dt * 0.7;
        if (c.position.x > 110) c.position.x = -110;
      }

      if (state.running) {
        state.elapsedRunTime += dt;

        // 1. Speed Control
        if (input.brake) {
          state.speedKmh = Math.max(70, state.speedKmh - 160 * dt);
        } else if (input.gas) {
          state.speedKmh = Math.min(state.maxSpeedKmh, state.speedKmh + 85 * dt);
        } else {
          state.speedKmh = THREE.MathUtils.lerp(state.speedKmh, state.baseCruiseKmh, dt * 1.2);
        }

        playerCar.userData.tailMat.emissiveIntensity = input.brake ? 2.6 : 1.35;

        if (state.highBeamTimer > 0) {
          state.highBeamTimer -= dt;
          playerCar.userData.beamMat.opacity = 0.42;
        } else {
          playerCar.userData.beamMat.opacity = 0.0;
        }

        // 2. Smooth Lateral Steering
        const steerSpeed = 15.5;
        let targetVx = 0;
        if (input.left) targetVx -= steerSpeed;
        if (input.right) targetVx += steerSpeed;

        state.vx = THREE.MathUtils.lerp(state.vx, targetVx, dt * 11);
        state.x += state.vx * dt;

        const maxLateral = ROAD_WIDTH / 2 - 1.25;
        if (state.x < -maxLateral) {
          state.x = -maxLateral;
          state.vx = 0;
        } else if (state.x > maxLateral) {
          state.x = maxLateral;
          state.vx = 0;
        }

        playerCar.position.x = state.x;
        playerCar.rotation.y = -state.vx * 0.015;
        playerCar.rotation.z = -state.vx * 0.011;

        // 3. Scroll Road, Golden Speed Streaks, Gantries & City Coastline
        const playerMetersPerSec = state.speedKmh / 3.6;
        roadTex.offset.y -= playerMetersPerSec * dt * 0.046;

        const speedFactor = THREE.MathUtils.clamp((state.speedKmh - 90) / 175, 0.25, 1.0);
        streakMatGold.opacity = 0.35 + speedFactor * 0.45;
        streakMatBright.opacity = 0.5 + speedFactor * 0.45;

        for (const st of speedStreaks) {
          st.mesh.position.z += playerMetersPerSec * dt * 1.45;
          // Anchor golden streaks close to the player car's lane as well as across the road
          if (Math.abs(st.baseOffset) < 2.0) {
            st.mesh.position.x = state.x + st.baseOffset;
          }
          if (st.mesh.position.z > 12) {
            st.mesh.position.z -= 82;
          }
        }

        for (const post of guardPosts) {
          post.position.z += playerMetersPerSec * dt;
          if (post.position.z > 55) post.position.z -= 410;
        }

        for (const gantry of highwayGantries) {
          gantry.position.z += playerMetersPerSec * dt;
          if (gantry.position.z > 25) gantry.position.z -= 405;
        }

        for (const canyon of canyonSegments) {
          canyon.position.z += playerMetersPerSec * dt;
          if (canyon.position.z > 65) canyon.position.z -= 440;
        }

        // 4. Update Traffic & Collision Detection
        for (let i = trafficList.length - 1; i >= 0; i--) {
          const v = trafficList[i];

          v.mesh.position.x = THREE.MathUtils.lerp(v.mesh.position.x, v.targetX, dt * 4.5);

          const vMetersPerSec = (v.isOncoming ? -v.speedKmh : v.speedKmh) / 3.6;
          const relSpeed = playerMetersPerSec - vMetersPerSec;
          v.z += relSpeed * dt;
          v.mesh.position.z = v.z;

          const dx = Math.abs(state.x - v.mesh.position.x);
          const dz = Math.abs(0 - v.z);

          const hitWidth = 0.86 + v.halfW * 0.82;
          const hitLength = 1.98 + v.halfL * 0.84;

          if (dx < hitWidth && dz < hitLength) {
            triggerCrash();
            break;
          }

          if (!v.overtaken && v.z > 0.5) {
            v.overtaken = true;
            if (dx < hitWidth + 1.4) {
              state.score += 150;
            }
          }

          if (v.z > 32) {
            trafficContainer.remove(v.mesh);
            trafficList.splice(i, 1);
          }
        }

        // 5. Spawn Traffic ONLY After 3 Full Seconds of Free Driving
        if (state.elapsedRunTime >= 3.0 && trafficList.length < 9) {
          let minZ = -190;
          for (const v of trafficList) {
            if (v.z < minZ) minZ = v.z;
          }
          const spawnZ = Math.min(-215, minZ - (40 + Math.random() * 26));

          if (Math.random() < 0.28 && isLaneSafeToSpawn(2, spawnZ) && isLaneSafeToSpawn(3, spawnZ)) {
            // Iconic Reference Formation: Ambulance in lane 2 + White/Magenta Box Truck & Slate-Blue Sedan in lane 3
            createTrafficVehicle('ambulance', 2, spawnZ - 14, 92);
            createTrafficVehicle('truck', 3, spawnZ - 6, 82);
            if (isLaneSafeToSpawn(3, spawnZ + 12)) {
              createTrafficVehicle('sedan', 3, spawnZ + 12, 86);
            }
          } else {
            const lane = Math.floor(Math.random() * 4);
            if (isLaneSafeToSpawn(lane, spawnZ)) {
              const types = ['sedan', 'ambulance', 'truck', 'coupe', 'suv', 'pickup', 'coach'];
              const randomType = types[Math.floor(Math.random() * types.length)];
              createTrafficVehicle(randomType, lane, spawnZ);
            }
          }
        }

        state.score += (state.speedKmh * 0.2) * dt;

        document.getElementById('hud-score').textContent = Math.floor(state.score).toLocaleString();
        document.getElementById('hud-speed').textContent = Math.floor(state.speedKmh);
      }

      updateCamera(dt);
      renderer.render(scene, camera);
    }

    function handleResize() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      renderer.setSize(w, h);
      camera.fov = w < h ? 52 : 44;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      updateCamera(0);
    }

    window.addEventListener('resize', handleResize);
    handleResize();

    window.onload = function () {
      requestAnimationFrame(animate);
    };
  </script>
</body>
</html>
